requirements:
  - id: REQ-001
    title: Payment Checkout Initialization
    description: System shall allow initializing a payment checkout session.
    priority: HIGH
    type: FUNCTIONAL
    status: IMPLEMENTED
    implements: []
    verifies: []

  - id: REQ-002
    title: Supported Currencies
    description: System shall support transactions in USD, EUR, and INR.
    priority: HIGH
    type: FUNCTIONAL
    status: APPROVED
    implements: []
    verifies: []

  - id: REQ-003
    title: Transaction Logging
    description: System shall log all transaction attempts with timestamps.
    priority: HIGH
    type: FUNCTIONAL
    status: IMPLEMENTED
    implements: []
    verifies: []

  - id: REQ-004
    title: Refund Processing
    description: System shall allow processing full or partial refunds for successful transactions.
    priority: HIGH
    type: FUNCTIONAL
    status: DRAFT
    implements: []
    verifies: []

  - id: REQ-005
    title: Card Validation Basic
    description: System shall perform basic format validation on card numbers (length and digits).
    priority: MEDIUM
    type: FUNCTIONAL
    status: IMPLEMENTED
    implements: []
    verifies: []

  - id: REQ-006
    title: Payment Timeout
    description: System shall timeout payment requests after 30 seconds of inactivity.
    priority: MEDIUM
    type: NON_FUNCTIONAL
    status: REVIEW
    implements: []
    verifies: []

  - id: REQ-007
    title: Receipt Generation
    description: System shall generate a digital receipt upon successful payment.
    priority: MEDIUM
    type: FUNCTIONAL
    status: APPROVED
    implements: []
    verifies: []

  - id: REQ-008
    title: Processing Fee Calculation
    description: System shall calculate and apply a processing fee based on transaction amount.
    priority: MEDIUM
    type: FUNCTIONAL
    status: IMPLEMENTED
    implements: []
    verifies: []

  - id: REQ-009
    title: High Availability
    description: Payment service shall have 99.99% uptime.
    priority: HIGH
    type: NON_FUNCTIONAL
    status: APPROVED
    implements: []
    verifies: []

  - id: REQ-010
    title: Fraud Detection Check
    description: System shall integrate with a fraud detection service before finalizing payment.
    priority: HIGH
    type: FUNCTIONAL
    status: DRAFT
    implements: []
    verifies: []

  - id: REQ-014
    title: High Value MFA
    description: System shall process payments up to ₹10,000 with MFA.
    priority: HIGH
    type: FUNCTIONAL
    status: REVIEW
    implements: []
    verifies: []

  - id: REQ-021
    title: Idempotent Payment Requests
    description: System shall treat identical payment requests within 2 minutes as duplicate and idempotent.
    priority: MEDIUM
    type: FUNCTIONAL
    status: APPROVED
    implements: []
    verifies: []
